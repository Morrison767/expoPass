# Сборка прототипа и публикация на GitHub Pages.
#
# Прототип не имеет бэкенда: данные живут в localStorage браузера,
# поэтому Next.js собирается в статический экспорт и раздаётся как
# обычный набор файлов.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить публикацию вручную из вкладки Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: важен последний результат,
# при этом уже идущую сборку не обрываем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка статического экспорта
        # На Pages сайт лежит в подкаталоге с именем репозитория,
        # поэтому базовый путь берётся из контекста, а не хардкодится
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Отключить обработку Jekyll
        # Иначе GitHub Pages проигнорирует каталог _next
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Включает Pages при первом запуске, чтобы не настраивать вручную
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
